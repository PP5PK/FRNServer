[System]
# http://alterfrn.ucoz.ru/index/server_config/0-27#s_3
PidFile=frnserver.pid
LogFile=/var/log/frnserver.log
LogClientLevel=5
LogExec=yes
ListDelimiter=";"
# DataChangeScript=
DataDir=/usr/src/FRNServer/
SystemCharsetName=ISO-8859-1

[Command]
# http://alterfrn.ucoz.ru/index/server_config/0-27#s_6
CommandEnabled=yes
CommandPort=10023
CommandIPVersion=4
CommandPreferIPv4=yes

[Message]
MessageHookScript=/usr/src/FRNServer/message_hook.sh

#[Recorder]
# http://alterfrn.ucoz.ru/index/section_12_recorder/0-25
#Enabled=yes
#Dir=/usr/src/FRNServer/recorder
#Direction=both
# FileNameFormat: LONG=YYYYMMDDHHNNSSZZZR.wav / SHORT=YYYYMMDDHHNNSSR.wav
# O sufixo R no nome do arquivo contém o indicativo do transmissor
#FileNameFormat=short
# SubdirMode: organiza os arquivos em subdiretórios YYYY/MM/DD
#SubdirMode=y-m-d
# MaxRecordTime em segundos: 180 = 3 minutos
#MaxRecordTime=180
# Script= (opcional) script pós-gravação para renomear/converter/mover arquivos
#Script=
